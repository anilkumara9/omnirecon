<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 980" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#8b95a9"/>
    </marker>
  </defs>

  <!-- Target -->
  <rect x="150" y="10" width="400" height="64" rx="12" fill="#1e3a5f" stroke="#6ea8fe" stroke-width="2"/>
  <text x="350" y="36" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">Target</text>
  <text x="350" y="58" text-anchor="middle" fill="#bcd2f5" font-size="13">URL · API doc · repo · APK / binary</text>

  <line x1="350" y1="74" x2="350" y2="104" stroke="#8b95a9" stroke-width="2" marker-end="url(#arr)"/>

  <!-- autopilot hero -->
  <rect x="110" y="104" width="480" height="76" rx="12" fill="#3b2d6e" stroke="#a78bfa" stroke-width="2.5"/>
  <text x="350" y="132" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="700">recon_auto_pilot — one call</text>
  <text x="350" y="154" text-anchor="middle" fill="#d6c9ff" font-size="13">full pipeline automatically · no orchestration needed</text>

  <line x1="350" y1="180" x2="350" y2="210" stroke="#8b95a9" stroke-width="2" marker-end="url(#arr)"/>

  <!-- 6 engines, 2x3 grid -->
  <rect x="20" y="210" width="205" height="70" rx="12" fill="#14324a" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="122" y="236" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">Route crawl</text>
  <text x="122" y="256" text-anchor="middle" fill="#bfe6ff" font-size="11">+ JS bundle APIs</text>

  <rect x="247" y="210" width="205" height="70" rx="12" fill="#14324a" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="350" y="236" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">Page inspect</text>
  <text x="350" y="256" text-anchor="middle" fill="#bfe6ff" font-size="11">DOM · screenshots · UI tokens</text>

  <rect x="474" y="210" width="205" height="70" rx="12" fill="#14324a" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="577" y="236" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">Network capture</text>
  <text x="577" y="256" text-anchor="middle" fill="#bfe6ff" font-size="11">XHR / fetch / WebSocket</text>

  <rect x="20" y="292" width="205" height="70" rx="12" fill="#14324a" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="122" y="318" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">Edge states</text>
  <text x="122" y="338" text-anchor="middle" fill="#bfe6ff" font-size="11">mock API failures</text>

  <rect x="247" y="292" width="205" height="70" rx="12" fill="#14324a" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="350" y="318" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">Source &amp; artifact</text>
  <text x="350" y="338" text-anchor="middle" fill="#bfe6ff" font-size="11">APK · Electron · codebase</text>

  <rect x="474" y="292" width="205" height="70" rx="12" fill="#14324a" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="577" y="318" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">Endpoint probe</text>
  <text x="577" y="338" text-anchor="middle" fill="#bfe6ff" font-size="11">live / guarded / dead</text>

  <!-- arrows from engines to ledger -->
  <line x1="122" y1="362" x2="280" y2="402" stroke="#8b95a9" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="350" y1="362" x2="350" y2="402" stroke="#8b95a9" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="577" y1="362" x2="420" y2="402" stroke="#8b95a9" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Evidence ledger -->
  <rect x="110" y="402" width="480" height="88" rx="12" fill="#3d2b00" stroke="#fbbf24" stroke-width="2"/>
  <text x="350" y="430" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">Evidence ledger</text>
  <text x="350" y="452" text-anchor="middle" fill="#ffe9b8" font-size="12">OBSERVED · SOURCE_VERIFIED · INFERRED</text>
  <text x="350" y="470" text-anchor="middle" fill="#ffe9b8" font-size="12">UNVERIFIED · BLOCKED — never invented</text>

  <line x1="350" y1="490" x2="350" y2="520" stroke="#8b95a9" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Generate spec -->
  <rect x="150" y="520" width="400" height="64" rx="12" fill="#0f3d2e" stroke="#34d399" stroke-width="2"/>
  <text x="350" y="546" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="700">recon_generate_spec</text>
  <text x="350" y="568" text-anchor="middle" fill="#b8f5dd" font-size="13">15-section rebuild blueprint</text>

  <line x1="350" y1="584" x2="350" y2="614" stroke="#8b95a9" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Output contract -->
  <rect x="110" y="614" width="480" height="76" rx="12" fill="#0f3d2e" stroke="#34d399" stroke-width="2"/>
  <text x="350" y="640" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="700">Output contract</text>
  <text x="350" y="662" text-anchor="middle" fill="#b8f5dd" font-size="12">findings + unknowns + limitations · budgeted</text>

  <line x1="350" y1="690" x2="350" y2="720" stroke="#8b95a9" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Export + Compare side by side -->
  <rect x="20" y="720" width="320" height="70" rx="12" fill="#0f3d2e" stroke="#34d399" stroke-width="1.5"/>
  <text x="180" y="746" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">recon_export_report</text>
  <text x="180" y="766" text-anchor="middle" fill="#b8f5dd" font-size="11">markdown · JSON · OpenAPI</text>

  <rect x="360" y="720" width="320" height="70" rx="12" fill="#0f3d2e" stroke="#34d399" stroke-width="1.5"/>
  <text x="520" y="746" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="700">recon_compare_build</text>
  <text x="520" y="766" text-anchor="middle" fill="#b8f5dd" font-size="11">verify rebuild vs reference</text>

  <!-- Session note -->
  <rect x="110" y="820" width="480" height="56" rx="12" fill="#141a2b" stroke="#3a4560" stroke-width="1.5"/>
  <text x="350" y="842" text-anchor="middle" fill="#cdd6ea" font-size="12">23 tools · sessions persist — pause, resume,</text>
  <text x="350" y="860" text-anchor="middle" fill="#cdd6ea" font-size="12">background crawls, or cancel anytime.</text>

  <!-- Legend -->
  <text x="20" y="908" fill="#8b95a9" font-size="12">Legend:</text>
  <rect x="80" y="896" width="18" height="18" rx="4" fill="#1e3a5f" stroke="#6ea8fe"/>
  <text x="104" y="910" fill="#cdd6ea" font-size="12">entry</text>
  <rect x="150" y="896" width="18" height="18" rx="4" fill="#3b2d6e" stroke="#a78bfa"/>
  <text x="174" y="910" fill="#cdd6ea" font-size="12">autopilot</text>
  <rect x="244" y="896" width="18" height="18" rx="4" fill="#14324a" stroke="#38bdf8"/>
  <text x="268" y="910" fill="#cdd6ea" font-size="12">engines</text>
  <rect x="334" y="896" width="18" height="18" rx="4" fill="#3d2b00" stroke="#fbbf24"/>
  <text x="358" y="910" fill="#cdd6ea" font-size="12">evidence</text>
  <rect x="434" y="896" width="18" height="18" rx="4" fill="#0f3d2e" stroke="#34d399"/>
  <text x="458" y="910" fill="#cdd6ea" font-size="12">outputs</text>

  <text x="350" y="948" text-anchor="middle" fill="#5b6579" font-size="12">Every claim cites the finding ID that proves it. Nothing is ever invented.</text>
</svg>
