<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 1040" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#475569"/>
    </marker>
    <linearGradient id="bggrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2f7"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="700" height="1040" fill="url(#bggrad)" rx="16"/>

  <text x="350" y="40" text-anchor="middle" fill="#0f172a" font-size="20" font-weight="800">OmniRecon Pipeline</text>
  <text x="350" y="62" text-anchor="middle" fill="#64748b" font-size="13">one call in · build-ready blueprint out</text>

  <!-- START terminator (stadium) -->
  <rect x="230" y="84" width="240" height="52" rx="26" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="350" y="110" text-anchor="middle" fill="#14532d" font-size="14" font-weight="700">START — target</text>
  <text x="350" y="128" text-anchor="middle" fill="#15803d" font-size="11">URL · API doc · repo · APK / binary</text>

  <line x1="350" y1="136" x2="350" y2="160" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>

  <!-- autopilot process -->
  <rect x="190" y="160" width="320" height="66" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="350" y="186" text-anchor="middle" fill="#1e3a8a" font-size="15" font-weight="700">recon_auto_pilot</text>
  <text x="350" y="208" text-anchor="middle" fill="#1d4ed8" font-size="12">runs the full pipeline — one call</text>

  <line x1="350" y1="226" x2="350" y2="250" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>

  <!-- 6 engines grid -->
  <rect x="20" y="250" width="205" height="64" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="122" y="274" text-anchor="middle" fill="#0c4a6e" font-size="13" font-weight="700">Route crawl</text>
  <text x="122" y="294" text-anchor="middle" fill="#0369a1" font-size="11">+ JS bundle APIs</text>

  <rect x="247" y="250" width="205" height="64" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="350" y="274" text-anchor="middle" fill="#0c4a6e" font-size="13" font-weight="700">Page inspect</text>
  <text x="350" y="294" text-anchor="middle" fill="#0369a1" font-size="11">DOM · screenshots · UI tokens</text>

  <rect x="474" y="250" width="205" height="64" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="577" y="274" text-anchor="middle" fill="#0c4a6e" font-size="13" font-weight="700">Network capture</text>
  <text x="577" y="294" text-anchor="middle" fill="#0369a1" font-size="11">XHR / fetch / WebSocket</text>

  <rect x="20" y="326" width="205" height="64" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="122" y="350" text-anchor="middle" fill="#0c4a6e" font-size="13" font-weight="700">Edge states</text>
  <text x="122" y="370" text-anchor="middle" fill="#0369a1" font-size="11">mock API failures</text>

  <rect x="247" y="326" width="205" height="64" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="350" y="350" text-anchor="middle" fill="#0c4a6e" font-size="13" font-weight="700">Source &amp; artifact</text>
  <text x="350" y="370" text-anchor="middle" fill="#0369a1" font-size="11">APK · Electron · codebase</text>

  <rect x="474" y="326" width="205" height="64" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
  <text x="577" y="350" text-anchor="middle" fill="#0c4a6e" font-size="13" font-weight="700">Endpoint probe</text>
  <text x="577" y="370" text-anchor="middle" fill="#0369a1" font-size="11">live / guarded / dead</text>

  <line x1="122" y1="390" x2="280" y2="424" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="350" y1="390" x2="350" y2="424" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="577" y1="390" x2="420" y2="424" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Evidence ledger (data store shape) -->
  <rect x="150" y="424" width="400" height="72" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="350" y="450" text-anchor="middle" fill="#78350f" font-size="15" font-weight="700">Evidence ledger</text>
  <text x="350" y="472" text-anchor="middle" fill="#92400e" font-size="12">OBSERVED · SOURCE_VERIFIED · INFERRED · UNVERIFIED · BLOCKED</text>

  <line x1="350" y1="496" x2="350" y2="520" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>

  <!-- decision diamond -->
  <polygon points="350,520 470,566 350,612 230,566" fill="#fde68a" stroke="#d97706" stroke-width="2"/>
  <text x="350" y="560" text-anchor="middle" fill="#78350f" font-size="13" font-weight="700">evidence</text>
  <text x="350" y="578" text-anchor="middle" fill="#78350f" font-size="13" font-weight="700">complete?</text>

  <!-- yes branch -->
  <line x1="470" y1="566" x2="540" y2="566" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <text x="505" y="558" text-anchor="middle" fill="#475569" font-size="11">yes</text>
  <rect x="540" y="532" width="140" height="68" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="610" y="556" text-anchor="middle" fill="#065f46" font-size="12" font-weight="700">generate</text>
  <text x="610" y="574" text-anchor="middle" fill="#065f46" font-size="12" font-weight="700">spec</text>

  <!-- no branch loops back -->
  <line x1="230" y1="566" x2="120" y2="566" stroke="#475569" stroke-width="2"/>
  <line x1="120" y1="566" x2="120" y2="320" stroke="#475569" stroke-width="2"/>
  <line x1="120" y1="320" x2="20" y2="320" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <text x="175" y="558" text-anchor="middle" fill="#475569" font-size="11">no → re-probe</text>

  <!-- spec process -->
  <line x1="610" y1="600" x2="610" y2="636" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="190" y="636" width="320" height="64" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="2"/>
  <text x="350" y="662" text-anchor="middle" fill="#065f46" font-size="15" font-weight="700">recon_generate_spec</text>
  <text x="350" y="684" text-anchor="middle" fill="#047857" font-size="12">15-section rebuild blueprint</text>

  <line x1="350" y1="700" x2="350" y2="724" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>

  <!-- output contract -->
  <rect x="150" y="724" width="400" height="64" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="350" y="750" text-anchor="middle" fill="#4c1d95" font-size="15" font-weight="700">Output contract</text>
  <text x="350" y="772" text-anchor="middle" fill="#6d28d9" font-size="12">findings + unknowns + limitations · budgeted</text>

  <line x1="350" y1="788" x2="350" y2="812" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Export + Compare -->
  <rect x="20" y="812" width="320" height="62" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="180" y="836" text-anchor="middle" fill="#065f46" font-size="13" font-weight="700">recon_export_report</text>
  <text x="180" y="856" text-anchor="middle" fill="#047857" font-size="11">markdown · JSON · OpenAPI</text>

  <rect x="360" y="812" width="320" height="62" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
  <text x="520" y="836" text-anchor="middle" fill="#065f46" font-size="13" font-weight="700">recon_compare_build</text>
  <text x="520" y="856" text-anchor="middle" fill="#047857" font-size="11">verify rebuild vs reference</text>

  <!-- END terminator -->
  <rect x="230" y="896" width="240" height="52" rx="26" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="350" y="922" text-anchor="middle" fill="#14532d" font-size="14" font-weight="700">END — blueprint</text>
  <text x="350" y="940" text-anchor="middle" fill="#15803d" font-size="11">nothing invented · every claim cited</text>

  <line x1="350" y1="874" x2="350" y2="896" stroke="#475569" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Legend -->
  <text x="20" y="992" fill="#475569" font-size="12" font-weight="700">Legend:</text>
  <rect x="80" y="980" width="60" height="22" rx="11" fill="#dcfce7" stroke="#16a34a"/>
  <text x="146" y="996" fill="#475569" font-size="12">start/end</text>
  <rect x="210" y="980" width="60" height="22" rx="4" fill="#dbeafe" stroke="#2563eb"/>
  <text x="276" y="996" fill="#475569" font-size="12">process</text>
  <polygon points="380,980 402,991 380,1002 358,991" fill="#fde68a" stroke="#d97706"/>
  <text x="408" y="996" fill="#475569" font-size="12">decision</text>
  <rect x="480" y="980" width="60" height="22" rx="4" fill="#fef3c7" stroke="#d97706"/>
  <text x="546" y="996" fill="#475569" font-size="12">evidence</text>
</svg>
